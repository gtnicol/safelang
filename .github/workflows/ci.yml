name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # gcc ships on the runner (covers the native C backend tests). wasmtime is not
      # preinstalled; without it the WASM tests skip via Assumptions.assumeTrue, so install
      # it to exercise the full backend matrix.
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build and verify (quality gate)
        run: mvn -B -Pquality verify
